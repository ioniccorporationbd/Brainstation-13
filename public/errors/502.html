<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bad Gateway | Magnetic Solution Limited</title>
<meta name="robots" content="noindex, nofollow" />
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#000;font-family:Ubuntu,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:64px 24px 88px}
.logo{height:54px;width:auto;margin-bottom:28px}
.pill{display:inline-block;background:#fdecec;color:#c91f28;font-size:12.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;border-radius:999px;padding:6px 14px;margin-bottom:22px}
.code{font-size:clamp(84px,18vw,148px);font-weight:700;line-height:.9;letter-spacing:-.055em;margin:0;user-select:none}
.code .accent{color:#c91f28}
h1{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:24px 0 0}
p.desc{font-size:16px;line-height:1.75;color:#55585e;max-width:540px;margin:16px 0 0}
.actions{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px;margin-top:36px}
.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:8px;padding:14px 24px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;transition:background-color .2s,border-color .2s,color .2s}
.primary{background:#c91f28;color:#fff;border:1px solid #c91f28}
.primary:hover{background:#a71920;border-color:#a71920}
.secondary{background:#fff;color:#000;border:1px solid #ececec}
.secondary:hover{border-color:#c91f28;color:#c91f28}
.note{margin-top:30px;font-size:13.5px;color:#8a8f98}
.note a{color:#000;font-weight:600;text-underline-offset:4px;text-decoration-color:#c91f28}
.note a:hover{color:#c91f28}
</style>
</head>
<body>
<main class="wrap">
  <img src="/images/brand/magnetic-logo.png" alt="Magnetic Solution Limited" class="logo" />
  <span class="pill">Error 502</span>
  <p class="code">5<span class="accent">0</span>2</p>
  <h1>Upstream service error</h1>
  <p class="desc">A service this page depends on returned an unexpected response. Nothing is wrong at your end — please try again in a moment.</p>
  <div class="actions">
    <button class="btn primary" onclick="location.reload()">Try Again</button>
    <a class="btn secondary" href="/">Back to Home</a>
  </div>
  <p class="note">Need help? <a href="/contact">Contact our team</a></p>
</main>
</body>
</html>
